<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070c09" id="theme-color-meta" />
    <meta name="description" content="Disciplined investment intelligence" />

    <!-- PWA / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Accrue" />
    <link rel="apple-touch-icon" href="icon-192.png" />

    <link rel="manifest" href="manifest.json" />
    <title>Accrue</title>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #070c09; }
    </style>

    <script>
      // Apply the saved theme to body background and the iOS status bar tint
      // immediately, before React mounts — avoids a flash of the wrong theme
      // for returning users who have light mode saved.
      (function() {
        try {
          var theme = localStorage.getItem("accrue_theme") || "dark";
          var bg = theme === "light" ? "#eceae5" : "#070c09";
          document.write('<style>body { background: ' + bg + ' !important; }</style>');
          var meta = document.getElementById("theme-color-meta");
          if (meta) meta.setAttribute("content", bg);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
